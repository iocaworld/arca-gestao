<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCA - Aguada de Baixo | Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="login-wrapper">
    <div class="login-grid">
      
      <!-- Coluna da Esquerda (Story e Apresentação) -->
      <section class="login-story">
        <span class="eyebrow">O TEU ESPAÇO PESSOAL</span>
        <h1 class="login-title">Uma vida.<br>Um lugar para<br>organizar tudo.</h1>
        <p class="login-subtitle">
          Documentos, contas, pessoas e planos.<br>
          Mais clareza para o teu dia a dia.
        </p>

        <div class="login-pills">
          <div class="pill-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Privado e só teu</span>
          </div>
          <div class="pill-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Tudo no mesmo sítio</span>
          </div>
          <div class="pill-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Ritmo sem pressa</span>
          </div>
        </div>

        <div class="login-signature">
          Feito para ti, Jorge.
        </div>
      </section>

      <!-- Coluna da Direita (Painel de Autenticação) -->
      <section class="login-panel">
        <div class="login-card">
          <div class="card-top">
            <div class="arca-logo-wrap">
              <img src="assets/arca-logo.png" alt="Logótipo ARCA - Aguada de Baixo">
            </div>
            <span class="eyebrow" style="margin-bottom: 0.35rem;">BEM-VINDO DE VOLTA</span>
            <h2>Entra no teu espaço</h2>
            <p>A tua informação, ao teu ritmo.</p>
          </div>

          <!-- Mensagem de Alerta -->
          <div id="loginAlert" class="alert-message"></div>

          <!-- Formulário -->
          <form id="arcaLoginForm" autocomplete="on">
            <div class="form-group">
              <label for="username">Utilizador</label>
              <div class="input-container">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  class="form-control" 
                  value="jorge" 
                  placeholder="O teu nome de utilizador"
                  required
                >
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-container">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-control" 
                  placeholder="A tua password secreta"
                  required
                >
              </div>
            </div>

            <div class="form-extras">
              <label class="remember-label">
                <input type="checkbox" checked>
                <span>Lembrar neste dispositivo</span>
              </label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
              <span>Entrar</span>
              <span class="arrow">&rarr;</span>
            </button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
