<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeuSite - Entrar na Conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Menu de Navegação -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>Meu</span>Site
      </a>

      <!-- Links de Navegação -->
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Início</a>
        <a href="index.html#recursos">Recursos</a>
        <a href="index.html#sobre">Sobre</a>
        <a href="login.html" class="active">Login</a>
      </nav>

      <!-- Botão Voltar para Início (Desktop) -->
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline">&larr; Voltar ao Início</a>
      </div>

      <!-- Botão Hambúrguer Mobile -->
      <button class="mobile-menu-btn" aria-label="Abrir menu" aria-expanded="false">
        &#9776;
      </button>
    </div>
  </header>

  <!-- Área Principal de Login -->
  <main class="login-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Bem-vindo de volta</h1>
        <p>Preencha os campos abaixo para acessar sua conta</p>
      </div>

      <!-- Caixa de Notificação/Alerta -->
      <div id="alertBox" class="alert" role="alert"></div>

      <!-- Formulário de Autenticação -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="seu.email@exemplo.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span>Lembrar de mim</span>
          </label>
          <a href="#" class="forgot-password" onclick="alert('Função de recuperação de senha será conectada ao seu backend.'); return false;">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <div class="auth-footer">
        <p>Ainda não tem conta? <a href="registo.html" style="font-weight: 700; color: var(--primary);">Solicitar Registo de Utilizador</a></p>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-links">
        <a href="index.html">Início</a>
        <a href="index.html#recursos">Recursos</a>
        <a href="login.html">Login</a>
        <a href="#privacidade">Privacidade</a>
        <a href="#termos">Termos de Uso</a>
      </div>
      <p>&copy; 2026 MeuSite. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
